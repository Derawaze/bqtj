name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build Windows x86 release
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Configure Git line endings
        run: git config --global core.autocrlf input

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up 32-bit MinGW
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          suppress-deprecation-warnings: msystem-mingw32
          update: true
          install: mingw-w64-i686-gcc

      - name: Restore and test
        run: |
          dotnet restore BqtjLauncher.sln
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test BqtjLauncher.sln --configuration Release --no-restore --verbosity normal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify managed formatting
        run: dotnet format BqtjLauncher.sln --verify-no-changes --no-restore --verbosity minimal

      - name: Verify public release legal files
        shell: pwsh
        run: |
          # 不擅自为项目选择开源许可证；随包必须保留第三方声明。
          foreach ($path in @('THIRD_PARTY_NOTICES.md')) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "公开发布缺少必要文件：$path"
            }
          }

      - name: Build release archive
        env:
          BQTJ_MINGW32_GCC: ${{ steps.msys2.outputs.msys2-location }}\mingw32\bin\gcc.exe
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          ./tools/Publish-Release.ps1 -Version $version -OutputDirectory ./artifacts/release

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BqtjLauncher-${{ github.ref_name }}-win-x86
          path: |
            artifacts/release/*.zip
            artifacts/release/*.sha256
          if-no-files-found: error

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $archive = @(Get-ChildItem -LiteralPath artifacts/release -Filter '*.zip')
          $checksum = @(Get-ChildItem -LiteralPath artifacts/release -Filter '*.sha256')
          if ($archive.Count -ne 1 -or $checksum.Count -ne 1) {
            throw '发布目录必须包含一个 ZIP 归档和一个 SHA-256 校验文件。'
          }
          $assets = @($archive[0].FullName, $checksum[0].FullName)
          $notes = "docs/release-$($env:RELEASE_TAG).md"
          if (-not (Test-Path -LiteralPath $notes)) { throw "缺少发布说明：$notes" }
          # 先完整上传到草稿，再公开；上传失败时不会留下缺附件的正式版本。
          gh release view $env:RELEASE_TAG --json isDraft --jq '.isDraft' 1>$env:RUNNER_TEMP/release-draft.txt 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ((Get-Content $env:RUNNER_TEMP/release-draft.txt -Raw).Trim() -ne 'true') {
              throw '该版本已公开，拒绝覆盖发行产物。'
            }
            gh release upload $env:RELEASE_TAG $assets --clobber
          } else {
            gh release create $env:RELEASE_TAG $assets --notes-file $notes --verify-tag --draft
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
