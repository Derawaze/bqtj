name: CI

on:
  push:
    branches: [main, dev, develop, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository and docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      product: ${{ steps.scope.outputs.product }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check repository and choose verification scope
        id: scope
        shell: pwsh
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
          FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' }}
        run: ./tools/Test-Repository.ps1 -BaseRevision $env:BASE_REVISION -FullVerification:($env:FORCE_FULL -eq 'true') -GitHubOutput $env:GITHUB_OUTPUT

      - name: Validate GitHub Actions workflows
        if: steps.scope.outputs.workflow == 'true'
        uses: docker://rhysd/actionlint:1.7.7

  verify:
    name: Windows x86 verification
    needs: repository
    if: needs.repository.outputs.product == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    steps:
      - name: Configure Git line endings
        run: git config --global core.autocrlf input

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'global.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Cache pinned vision dependencies
        uses: actions/cache@v4
        with:
          path: |
            artifacts/dev/automation/MAA-win-x86_64-v5.14.2.zip
            artifacts/dev/automation/maa-5.14.2-win-x64
            artifacts/dev/automation/ppocr-v4-zh-cn
          key: ${{ runner.os }}-vision-${{ hashFiles('tools/Prepare-MaaFramework.ps1', 'tools/Prepare-MaaOcr.ps1', 'tools/maa-ocr-models.json') }}

      - name: Set up 32-bit MinGW
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: mingw-w64-i686-gcc mingw-w64-x86_64-gcc

      - name: Restore
        run: dotnet restore BqtjLauncher.sln

      - name: Verify managed formatting
        run: dotnet format BqtjLauncher.sln --verify-no-changes --no-restore --verbosity minimal

      - name: Test managed modules
        run: dotnet test BqtjLauncher.sln --configuration Release --no-restore --verbosity normal

      - name: Verify native command recovery
        env:
          BQTJ_MINGW32_GCC: ${{ steps.msys2.outputs.msys2-location }}\mingw32\bin\gcc.exe
        run: ./tools/Test-NativeCommandRecovery.ps1 -CompilerPath $env:BQTJ_MINGW32_GCC

      - name: Verify account manager UI and single instance
        env:
          BQTJ_MINGW32_GCC: ${{ steps.msys2.outputs.msys2-location }}\mingw32\bin\gcc.exe
        run: ./tools/Test-AccountManager.ps1 -CompilerPath $env:BQTJ_MINGW32_GCC

      - name: Verify script manager UI and shared vision
        env:
          BQTJ_MINGW64_GXX: ${{ steps.msys2.outputs.msys2-location }}\mingw64\bin\g++.exe
        run: ./tools/Test-ScriptManagement.ps1 -Compiler64Path $env:BQTJ_MINGW64_GXX -AllowNonInteractive
      - name: Build self-contained Windows package
        env:
          BQTJ_MINGW32_GCC: ${{ steps.msys2.outputs.msys2-location }}\mingw32\bin\gcc.exe
        run: ./tools/Publish-Release.ps1 -Development -Version ("0.0.0-dev." + [DateTime]::UtcNow.ToString('yyyyMMddHHmmss'))

      - name: Upload verification package
        uses: actions/upload-artifact@v4
        with:
          name: BqtjLauncher-win-x86-${{ github.sha }}
          path: |
            artifacts/dev/*.zip
            artifacts/dev/*.sha256
          if-no-files-found: error
          retention-days: 7
