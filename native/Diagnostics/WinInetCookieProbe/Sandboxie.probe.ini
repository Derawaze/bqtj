# 仅供人工审阅的诊断配置片段；不自动安装或合并到系统 Sandboxie.ini。
# 必须核查 GlobalSettings/用户模板没有放行 Cookie、WebCache、DOMStore 或 Flash 状态。
# WriteFilePath 隐藏宿主旧状态，保留沙箱内新状态；不能启用 DirectAccess Cookie 模板。
[BqtjCookieProbeA]
Enabled=y
AutoDelete=n
AutoRecover=n
NeverDelete=y
DropAdminRights=y
WriteFilePath=%Cookies%
WriteFilePath=%Local AppData%\Microsoft\Windows\INetCookies
WriteFilePath=%Local AppData%\Microsoft\Windows\INetCache
WriteFilePath=%Local AppData%\Microsoft\Windows\WebCache
WriteFilePath=%Local AppData%\Microsoft\Internet Explorer\DOMStore
WriteFilePath=%AppData%\Macromedia\Flash Player
WriteFilePath=%AppData%\Adobe\Flash Player

[BqtjCookieProbeB]
Enabled=y
AutoDelete=n
AutoRecover=n
NeverDelete=y
DropAdminRights=y
WriteFilePath=%Cookies%
WriteFilePath=%Local AppData%\Microsoft\Windows\INetCookies
WriteFilePath=%Local AppData%\Microsoft\Windows\INetCache
WriteFilePath=%Local AppData%\Microsoft\Windows\WebCache
WriteFilePath=%Local AppData%\Microsoft\Internet Explorer\DOMStore
WriteFilePath=%AppData%\Macromedia\Flash Player
WriteFilePath=%AppData%\Adobe\Flash Player
